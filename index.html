<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>∎ω SHOW · Abbildung · Echo · Figur</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #c8d0d0;
            font-family: 'Consolas', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: radial-gradient(ellipse at 50% 50%, #0a0a1a, #000000);
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(10,10,20,0.3);
            border: 1px solid rgba(0,255,136,0.03);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 36px;
            color: #00ff88;
            letter-spacing: 6px;
            text-shadow: 0 0 60px rgba(0,255,136,0.05);
        }
        .header .sub {
            color: #445555;
            font-size: 11px;
            letter-spacing: 3px;
        }
        .header .sub .show { color: #00ff88; }
        .header .sub .echo { color: #ff66ff; }

        .symbol {
            font-size: 80px;
            text-align: center;
            color: #00ff88;
            text-shadow: 0 0 40px rgba(0,255,136,0.05);
            margin-bottom: 10px;
        }

        .show-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }
        @media (max-width:800px){ .show-grid { grid-template-columns:1fr 1fr; } }
        @media (max-width:450px){ .show-grid { grid-template-columns:1fr; } }

        .show-card {
            background: rgba(10,10,20,0.3);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 10px;
            padding: 12px 10px;
            text-align: center;
            transition: all 0.4s ease;
        }
        .show-card .icon { font-size: 24px; }
        .show-card .label {
            color: #445555;
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .show-card .value {
            font-size: 16px;
            font-weight: bold;
            color: #88ddbb;
            margin-top: 2px;
            font-family: monospace;
        }
        .show-card .value.echo { color: #ff66ff; }
        .show-card .value.cause { color: #ffaa00; }
        .show-card .value.effect { color: #00ff88; }

        .holo-wrap {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            aspect-ratio: 16/9;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(0,255,136,0.03);
            overflow: hidden;
        }
        #showCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }
        .controls button {
            background: rgba(20,35,35,0.2);
            color: #668888;
            border: 1px solid rgba(255,255,255,0.02);
            padding: 5px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            transition: all 0.3s;
        }
        .controls button:hover { background: rgba(40,80,70,0.08); color: #aaeedd; }
        .controls button.active { background: rgba(40,80,70,0.06); color: #00ff88; }
        .controls button.show { color: #00ff88; border-color: rgba(0,255,136,0.05); }
        .controls button.echo { color: #ff66ff; border-color: rgba(255,102,255,0.05); }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            margin-top: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            font-size: 9px;
            color: #445555;
            border: 1px solid rgba(255,255,255,0.01);
        }
        .status-bar .show { color: #00ff88; }
        .status-bar .echo { color: #ff66ff; }

        .footer {
            text-align: center;
            margin-top: 10px;
            color: #222;
            font-size: 8px;
            letter-spacing: 2px;
        }
        .footer span { color: #00ff88; }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="symbol">∎ω</div>
        <h1>SHOW · Abbildung</h1>
        <div class="sub"><span class="show">Figur</span> · <span class="echo">Echo</span> · Ursache · Wirkung</div>
    </div>

    <div class="show-grid" id="showGrid">
        <div class="show-card">
            <div class="icon">🎭</div>
            <div class="label">Figur</div>
            <div class="value" id="figurValue">—</div>
        </div>
        <div class="show-card">
            <div class="icon">⚡</div>
            <div class="label">Ursache</div>
            <div class="value cause" id="causeValue">—</div>
        </div>
        <div class="show-card">
            <div class="icon">🌀</div>
            <div class="label">Wirkung</div>
            <div class="value effect" id="effectValue">—</div>
        </div>
        <div class="show-card">
            <div class="icon">🔊</div>
            <div class="label">Echo</div>
            <div class="value echo" id="echoValue">—</div>
        </div>
    </div>

    <div class="holo-wrap">
        <canvas id="showCanvas"></canvas>
    </div>

    <div class="controls">
        <button class="active show" id="btnStart">▶ START</button>
        <button class="show" id="btnShow">∎ω SHOW</button>
        <button class="echo" id="btnEcho">🔊 ECHO</button>
        <button id="btnFigur">🎭 FIGUR</button>
        <button id="btnProof">🔮 PROOF</button>
        <button id="btnReset">⟲ RESET</button>
        <button id="btnWarb10">⚡ WARB10</button>
    </div>

    <div class="status-bar">
        <span class="show">∎ω SHOW: <span id="showStatus">aktiv</span></span>
        <span class="echo">🔊 ECHO: <span id="echoStatus">bereit</span></span>
        <span>⏱️ <span id="timeStatus">00:00</span></span>
        <span>⚡ WARB10: <span id="warbStatus">—</span></span>
    </div>

    <div class="footer">
        <span>∎ω</span> SHOW · Abbildung · Echo · <span>wieimmer4u</span>
    </div>

</div>

<script>
// ============================================================
// SHOW · Abbildung · Figur · Echo · Ursache · Wirkung · WARB10
// ============================================================

// ─── CANVAS ──────────────────────────────────────────────────
const canvas = document.getElementById('showCanvas');
const ctx = canvas.getContext('2d');
let running = true;
let time = 0;
let showMode = 'show';
let warb10Active = false;
let warb10Value = 0;

function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width || 600;
    canvas.height = rect.height || (rect.width * 9/16) || 340;
}
window.addEventListener('resize', resizeCanvas);

// ─── FIGUREN ──────────────────────────────────────────────────
const FIGUREN = [
    { name: 'KREIS', form: 'circle', axis: 1, orbit: 2, pulse: 0.5, symbol: '◉', cause: 'Rotation', effect: 'Stabilität' },
    { name: 'QUADRAT', form: 'square', axis: 2, orbit: 3, pulse: 0.7, symbol: '■', cause: 'Spannung', effect: 'Struktur' },
    { name: 'DREIECK', form: 'triangle', axis: 3, orbit: 4, pulse: 0.3, symbol: '▲', cause: 'Druck', effect: 'Form' },
    { name: 'LINIE', form: 'line', axis: 4, orbit: 1, pulse: 0.9, symbol: '━', cause: 'Bewegung', effect: 'Richtung' },
    { name: 'PUNKT', form: 'point', axis: 0, orbit: 0, pulse: 1.0, symbol: '●', cause: 'Ursprung', effect: 'Ruhe' },
    { name: 'SPIRALE', form: 'spiral', axis: 5, orbit: 6, pulse: 0.6, symbol: '🌀', cause: 'Krümmung', effect: 'Flow' },
    { name: 'STERN', form: 'star', axis: 7, orbit: 8, pulse: 0.8, symbol: '★', cause: 'Explosion', effect: 'Vielheit' },
    { name: 'WELLE', form: 'wave', axis: 6, orbit: 5, pulse: 0.4, symbol: '～', cause: 'Oszillation', effect: 'Kontinuität' },
];

let currentFigur = FIGUREN[0];
let currentEcho = null;

// ─── SHOW UNIJ ──────────────────────────────────────────────
function SHOW_UNIJ(figur) {
    const t = Date.now();
    return {
        identity: "∎ω",
        figur: figur,
        layer: figur.layer || null,
        symbol: figur.symbol || "∎",
        cause: figur.cause || null,
        effect: figur.effect || null,
        echo: {
            form: figur.form,
            axis: figur.axis,
            orbit: figur.orbit,
            pulse: figur.pulse,
            time: t
        },
        unchanged: true,
        visible: true,
        timestamp: t
    };
}

// ─── WARB10 ──────────────────────────────────────────────────
function WARB10() {
    warb10Active = !warb10Active;
    if (warb10Active) {
        warb10Value = 10;
        document.getElementById('warbStatus').textContent = '⚡ AKTIV';
        document.getElementById('warbStatus').style.color = '#ffaa00';
        document.getElementById('btnWarb10').style.borderColor = '#ffaa00';
        document.getElementById('btnWarb10').style.color = '#ffaa00';
        // WARB10-Effekt: Figur pulsiert stärker
        currentFigur.pulse = 1.2;
        console.log('⚡ WARB10 AKTIVIERT');
    } else {
        warb10Value = 0;
        document.getElementById('warbStatus').textContent = '—';
        document.getElementById('warbStatus').style.color = '#445555';
        document.getElementById('btnWarb10').style.borderColor = 'rgba(255,255,255,0.02)';
        document.getElementById('btnWarb10').style.color = '#668888';
        currentFigur.pulse = 0.5;
        console.log('⚡ WARB10 DEAKTIVIERT');
    }
    updateShow();
}

// ─── UPDATE SHOW ─────────────────────────────────────────────
function updateShow() {
    const show = SHOW_UNIJ(currentFigur);
    currentEcho = show.echo;

    document.getElementById('figurValue').textContent = currentFigur.name;
    document.getElementById('figurValue').style.color = 
        currentFigur.form === 'circle' ? '#88ddbb' :
        currentFigur.form === 'square' ? '#ffaa00' :
        currentFigur.form === 'triangle' ? '#ff66ff' :
        currentFigur.form === 'line' ? '#00ff88' :
        currentFigur.form === 'point' ? '#ffffff' :
        currentFigur.form === 'spiral' ? '#ff88ff' :
        currentFigur.form === 'star' ? '#ffdd44' :
        currentFigur.form === 'wave' ? '#44ddff' : '#88ddbb';

    document.getElementById('causeValue').textContent = currentFigur.cause;
    document.getElementById('effectValue').textContent = currentFigur.effect;
    document.getElementById('echoValue').textContent = `${currentFigur.symbol} · ${currentFigur.form}`;

    document.getElementById('showStatus').textContent = 'aktiv';
    document.getElementById('echoStatus').textContent = `✓ ${currentFigur.form}`;
}

// ─── RENDER ──────────────────────────────────────────────────
function renderShow(timestamp) {
    if (!running) return;
    time = timestamp || Date.now();
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2;
    const maxDim = Math.min(w, h);

    ctx.clearRect(0, 0, w, h);

    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxDim * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(0.5, '#050510');
    grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const fig = currentFigur;
    const pulse = fig.pulse + (warb10Active ? 0.4 : 0) + Math.sin(time / 2000) * 0.2;
    const size = maxDim * (0.15 + pulse * 0.15);
    const rot = time / 3000 * fig.axis;
    const orbit = fig.orbit * 10;

    // Echo-Kreise
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
        const r = size + i * 30 + (warb10Active ? 10 : 0);
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
    }

    // WARB10-Energie-Ring
    if (warb10Active) {
        ctx.strokeStyle = `rgba(255,170,0,${0.1 + Math.sin(time/500) * 0.05})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 10]);
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Figur zeichnen
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    const color = fig.form === 'circle' ? '#88ddbb' :
        fig.form === 'square' ? '#ffaa00' :
        fig.form === 'triangle' ? '#ff66ff' :
        fig.form === 'line' ? '#00ff88' :
        fig.form === 'point' ? '#ffffff' :
        fig.form === 'spiral' ? '#ff88ff' :
        fig.form === 'star' ? '#ffdd44' :
        fig.form === 'wave' ? '#44ddff' : '#88ddbb';

    ctx.shadowColor = color + '44';
    ctx.shadowBlur = 30 + (warb10Active ? 30 : 0);
    ctx.strokeStyle = color + '88';
    ctx.lineWidth = 2 + (warb10Active ? 2 : 0);
    ctx.fillStyle = color + '22';

    if (fig.form === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    } else if (fig.form === 'square') {
        const s = size * 0.5;
        ctx.fillRect(-s, -s, s * 2, s * 2);
        ctx.strokeRect(-s, -s, s * 2, s * 2);
    } else if (fig.form === 'triangle') {
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
            const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
            const x = Math.cos(a) * size * 0.6;
            const y = Math.sin(a) * size * 0.6;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } else if (fig.form === 'line') {
        ctx.beginPath();
        ctx.moveTo(-size * 0.8, 0);
        ctx.lineTo(size * 0.8, 0);
        ctx.stroke();
    } else if (fig.form === 'point') {
        ctx.shadowBlur = 50 + (warb10Active ? 30 : 0);
        ctx.fillStyle = color + '88';
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.1, 0, Math.PI * 2);
        ctx.fill();
    } else if (fig.form === 'spiral') {
        ctx.shadowBlur = 20 + (warb10Active ? 20 : 0);
        ctx.beginPath();
        for (let i = 0; i < 80; i++) {
            const a = i * 0.15;
            const r = size * 0.02 * i * (warb10Active ? 1.3 : 1);
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    } else if (fig.form === 'star') {
        ctx.shadowBlur = 20 + (warb10Active ? 20 : 0);
        const points = 5;
        const outer = size * 0.5;
        const inner = outer * 0.4;
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
            const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
            const r = i % 2 === 0 ? outer : inner;
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } else if (fig.form === 'wave') {
        ctx.shadowBlur = 10;
        ctx.beginPath();
        for (let i = 0; i < 100; i++) {
            const x = -size * 0.8 + (i / 100) * size * 1.6;
            const y = Math.sin(x / 20 + time / 1000) * size * 0.2;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    ctx.restore();

    // Echo-Text
    ctx.shadowBlur = 0;
    ctx.fillStyle = color + '44';
    ctx.font = `${maxDim * 0.025}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`∎ω ${fig.symbol} · ${fig.form}${warb10Active ? ' ⚡WARB10' : ''}`, cx, h - 20);

    // Uhrzeit
    const seconds = Math.floor((time / 1000) % 60);
    const minutes = Math.floor((time / 60000) % 60);
    document.getElementById('timeStatus').textContent =
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

    requestAnimationFrame(renderShow);
}

// ─── FIGUR WECHSELN ──────────────────────────────────────────
function nextFigur() {
    const idx = FIGUREN.indexOf(currentFigur);
    currentFigur = FIGUREN[(idx + 1) % FIGUREN.length];
    if (!warb10Active) currentFigur.pulse = 0.5;
    updateShow();
}

function randomFigur() {
    currentFigur = FIGUREN[Math.floor(Math.random() * FIGUREN.length)];
    if (!warb10Active) currentFigur.pulse = 0.5;
    updateShow();
}

// ─── TOGGLE SHOW ─────────────────────────────────────────────
function toggleShow() {
    showMode = showMode === 'show' ? 'echo' : 'show';
    document.getElementById('btnShow').textContent = showMode === 'show' ? '∎ω SHOW' : '∎ω ECHO';
    document.getElementById('btnShow').classList.toggle('active');
}

function toggleEcho() {
    const echo = currentEcho || { form: '—', axis: 0, orbit: 0, pulse: 0 };
    document.getElementById('echoValue').textContent =
        showMode === 'echo' ? `🔊 ${echo.form} · ${echo.axis}·${echo.orbit}` : `${currentFigur.symbol} · ${currentFigur.form}`;
    document.getElementById('btnEcho').classList.toggle('active');
}

// ─── PROOF ────────────────────────────────────────────────────
function showProof() {
    const proof = document.createElement('div');
    proof.style.cssText = `
        position: fixed; inset: 0; background: rgba(0,0,0,0.85);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999; backdrop-filter: blur(20px);
        font-family: 'Consolas', monospace;
    `;
    proof.innerHTML = `
        <div style="text-align:center; padding:40px; border:1px solid rgba(0,255,136,0.1); border-radius:20px; background:rgba(10,10,20,0.6); max-width:450px;">
            <div style="font-size:48px; color:#00ff88;">∎ω</div>
            <div style="color:#00ff88; font-size:20px; margin:12px 0; letter-spacing:4px;">SHOW · ABBILDUNG</div>
            <div style="color:#88ddbb; font-size:13px; line-height:1.8;">
                🎭 Figur: ${currentFigur.name}<br>
                ⚡ Ursache: ${currentFigur.cause}<br>
                🌀 Wirkung: ${currentFigur.effect}<br>
                🔊 Echo: ${currentFigur.form} · ${currentFigur.axis}·${currentFigur.orbit}<br>
                ${currentEcho ? `⏱️ Zeit: ${new Date(currentEcho.time).toLocaleTimeString()}` : ''}
                ${warb10Active ? '⚡ WARB10: AKTIV' : ''}
            </div>
            <button onclick="this.parentElement.parentElement.remove()" style="
                margin-top:14px; background:rgba(20,35,35,0.2); color:#668888;
                border:1px solid rgba(255,255,255,0.02); padding:6px 20px;
                border-radius:18px; cursor:pointer; font-family:inherit; font-size:9px;
            ">⏎ SCHLIESSEN</button>
        </div>
    `;
    document.body.appendChild(proof);
}

// ─── CONTROLS ─────────────────────────────────────────────────
document.getElementById('btnStart').addEventListener('click', () => {
    running = true;
    document.getElementById('btnStart').classList.add('active');
    document.getElementById('showStatus').textContent = 'aktiv';
    renderShow(Date.now());
});

document.getElementById('btnShow').addEventListener('click', toggleShow);
document.getElementById('btnEcho').addEventListener('click', toggleEcho);
document.getElementById('btnFigur').addEventListener('click', nextFigur);
document.getElementById('btnProof').addEventListener('click', showProof);
document.getElementById('btnWarb10').addEventListener('click', WARB10);

document.getElementById('btnReset').addEventListener('click', () => {
    running = false;
    currentFigur = FIGUREN[0];
    showMode = 'show';
    warb10Active = false;
    warb10Value = 0;
    currentFigur.pulse = 0.5;
    document.getElementById('btnStart').classList.remove('active');
    document.getElementById('btnShow').textContent = '∎ω SHOW';
    document.getElementById('btnShow').classList.remove('active');
    document.getElementById('btnEcho').classList.remove('active');
    document.getElementById('btnWarb10').style.borderColor = 'rgba(255,255,255,0.02)';
    document.getElementById('btnWarb10').style.color = '#668888';
    document.getElementById('warbStatus').textContent = '—';
    document.getElementById('warbStatus').style.color = '#445555';
    updateShow();
    setTimeout(() => {
        running = true;
        document.getElementById('btnStart').classList.add('active');
        document.getElementById('showStatus').textContent = 'aktiv';
        renderShow(Date.now());
    }, 300);
});

// ─── TASTATUR ─────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btnStart').click(); }
    if (e.key === 'f' || e.key === 'F') nextFigur();
    if (e.key === 'r' || e.key === 'R') randomFigur();
    if (e.key === 's' || e.key === 'S') document.getElementById('btnShow').click();
    if (e.key === 'e' || e.key === 'E') document.getElementById('btnEcho').click();
    if (e.key === 'p' || e.key === 'P') document.getElementById('btnProof').click();
    if (e.key === 'w' || e.key === 'W') document.getElementById('btnWarb10').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btnReset').click();
});

// ─── INIT ────────────────────────────────────────────────────
resizeCanvas();
setTimeout(resizeCanvas, 200);
updateShow();
renderShow(Date.now());

console.log('∎ω SHOW · Abbildung · Echo · Figur · WARB10');
console.log('🎭 Figur: KREIS');
console.log('⌨️  Leertaste=Start  f=Figur  r=Zufall  s=SHOW  e=ECHO  p=Proof  w=WARB10  x=Reset');
</script>

</body>
</html>
