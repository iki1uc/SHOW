<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SHOW Modul</title>

<style>
  body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    padding:40px;
  }
  .video-wrap {
    text-align:center;
    margin-bottom:40px;
  }
  .info {
    border:1px solid #0f0;
    padding:20px;
  }
</style>
</head>

<body>

<div class="video-wrap">
  <video 
    controls 
    preload="metadata" 
    width="640"
    poster="show_poster.png"
    playsinline
    loading="lazy">
    
    <source src="show_video.webm" type="video/webm">
    <source src="show_video.mp4" type="video/mp4">

    <p>Video wird nicht unterstützt.</p>
  </video>
</div>

<div class="info">
  SHOW Modul aktiv – Video geladen.
</div>

</body>
</html>
